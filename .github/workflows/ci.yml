name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: catches a pinned download (browser, addon, packages) that has disappeared.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to a commit, not a tag: a tag can be moved to other code.

jobs:
  checks:
    name: Lint, tests, compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the gateway's locked packages and the test tools
        run: pip install -r gateway/requirements.lock -r tests/requirements.txt

      - name: Lint (errors only)
        run: ruff check --select F,E9 gateway whisper tts tests crawl4ai scripts

      - name: Unit tests
        run: pytest -q tests

      - name: Shell scripts
        run: shellcheck --severity=warning gateway/camoufox-mcp/*.sh

      - name: Compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.amd-gpu.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.debug-logs.yml config -q

  gateway-image:
    name: Gateway image (downloads the browser, runs its selftest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Free disk space for the browser
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build
        run: docker build -t toolbox-gateway-ci gateway
