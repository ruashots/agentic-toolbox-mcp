use_default_settings: true

general:
  instance_name: "toolbox-searxng"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json    # required so the gateway can consume results

server:
  # SearXNG uses this key to sign its image and favicon proxy links. Only the
  # toolbox gateway can reach this instance and both proxies are off, so the
  # placeholder is harmless here. Replace it with any random string if you like,
  # for example the output of: openssl rand -hex 32
  secret_key: "REPLACE_AT_DEPLOY"
  limiter: false   # we ARE bots; this is a private instance on a trusted LAN
  image_proxy: false
  http_protocol_version: "1.1"

ui:
  static_use_hash: true
  default_locale: "en"
  query_in_title: false
  infinite_scroll: false

outgoing:
  request_timeout: 10.0
  max_request_timeout: 20.0
  pool_connections: 100
  pool_maxsize: 20

# Engines, measured on 2026-11-21 with eight everyday searches through this
# SearXNG version. On-topic results out of all results returned:
#   google 75/79, brave 78/80, duckduckgo 70/70, yandex 75/80, yahoo 55/56.
#   bing 3/80: it answers for one word of the search only (docker.com for
#   "docker compose healthcheck"), so it is off.
# startpage, qwant, mojeek, presearch, aol and yep refused or failed from the
# same network. The defaults among them stay on: SearXNG pauses an engine that
# keeps failing and tries it again later, so a paused engine costs nothing and
# comes back on its own if the block lifts.
engines:
  - name: bing
    disabled: true
  - name: yandex
    disabled: false
  - name: yahoo
    disabled: false
  # Not loaded at all. Neither adds anything to search_web's results (wikidata only
  # fills SearXNG's own info boxes, which search_web does not return, and radio
  # browser finds radio stations), and each one contacted its servers every time
  # SearXNG started.
  - name: wikidata
    inactive: true
  - name: radio browser
    inactive: true
