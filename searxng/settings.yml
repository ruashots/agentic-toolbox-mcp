use_default_settings: true

general:
  instance_name: "toolbox-searxng"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json    # required so the gateway can consume results

server:
  # SearXNG uses this key to sign its image and favicon proxy links. Only the
  # toolbox gateway can reach this instance and both proxies are off, so the
  # placeholder is harmless here. Replace it with any random string if you like,
  # for example the output of: openssl rand -hex 32
  secret_key: "REPLACE_AT_DEPLOY"
  limiter: false   # we ARE bots; this is a private instance on a trusted LAN
  image_proxy: false
  http_protocol_version: "1.1"

ui:
  static_use_hash: true
  default_locale: "en"
  query_in_title: false
  infinite_scroll: false

outgoing:
  request_timeout: 10.0
  max_request_timeout: 20.0
  pool_connections: 100
  pool_maxsize: 20

# Engines. Most default general engines refuse automated queries: when tested
# on 2026-08-31, duckduckgo and startpage answered with a CAPTCHA, brave
# rate-limited, qwant and wikidata denied access, and google and mojeek parsed
# to nothing. The three below returned real results the same day. The other
# defaults stay enabled on purpose: SearXNG pauses an engine that keeps failing
# and tries it again later, so a paused engine costs nothing and comes back on
# its own if the block lifts.
engines:
  - name: bing
    disabled: false
  - name: yandex
    disabled: false
  - name: yep
    disabled: false
  # Not loaded at all. Neither adds anything to search_web's results (wikidata only
  # fills SearXNG's own info boxes, which search_web does not return, and radio
  # browser finds radio stations), and each one contacted its servers every time
  # SearXNG started.
  - name: wikidata
    inactive: true
  - name: radio browser
    inactive: true
