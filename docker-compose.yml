name: toolbox

services:
  searxng:
    image: searxng/searxng@sha256:1a9d21346437a41ddfc2286968026dddece1d4d0721625cffa2c3b00bb2f9cf3  # frozen 2026-11-19
    container_name: tb-searxng
    restart: unless-stopped
    networks: [toolbox]
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - UWSGI_WORKERS=4
      - UWSGI_THREADS=4

  crawl4ai:
    image: unclecode/crawl4ai@sha256:a45fd08f8f15f67026c1bff0a151f0479244caf6751a0c6943b3870efafcd025  # frozen 2026-11-19
    container_name: tb-crawl4ai
    restart: unless-stopped
    networks: [toolbox]
    shm_size: 1gb
    environment:
      - INSTALL_TYPE=all
      - ENABLE_GPU=false

  stirling-pdf:
    image: frooodle/s-pdf@sha256:b75b5ae2fcb75948f468718ed4c0bd499a8cafc9daf7f90f4c1e0e5a6acf9df8  # Stirling 2.11.0 pinned 2026-06-02 (was :latest; auto-broke auth+endpoint)
    container_name: tb-stirling
    restart: unless-stopped
    networks: [toolbox]
    ports:
      - "8085:8080"   # exposed for direct UI use; gateway also calls it internally
    volumes:
      - stirling-data:/configs
      - stirling-logs:/logs
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - SECURITY_ENABLELOGIN=false
      - LANGS=en_US

  whisper:
    build: ./whisper
    container_name: tb-whisper
    restart: unless-stopped
    networks: [toolbox]
    devices:
      - /dev/dri/card1:/dev/dri/card1
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "44"     # video (host)
      - "993"    # render (host)
    volumes:
      - whisper-models:/models

  tts:
    build: ./tts
    container_name: tb-tts
    restart: unless-stopped
    networks: [toolbox]
    # CPU-only by design: OmniVoice has no ROCm path and this host's GPU is AMD.
    # Give it real cores — synthesis is the one CPU-bound tool in the stack.
    cpus: 8
    volumes:
      - tts-models:/models

  gateway:
    build: ./gateway
    container_name: tb-gateway
    restart: unless-stopped
    networks: [toolbox]
    ports:
      - "8000:8000"   # MCP streamable-http endpoint
    environment:
      - SEARXNG_URL=http://searxng:8080
      - CRAWL4AI_URL=http://crawl4ai:11235
      - STIRLING_URL=http://stirling-pdf:8080
      - WHISPER_URL=http://whisper:8000
      - TTS_URL=http://tts:8000
      - TOOLBOX_TOKEN=${TOOLBOX_TOKEN:-}
    # The Camoufox browser is baked into the image at build time (gateway/Dockerfile).
    # No volume for /root/.cache, and nothing is downloaded at run time.
    depends_on:
      - searxng
      - crawl4ai
      - stirling-pdf
      - whisper
      - tts

networks:
  toolbox:
    driver: bridge

volumes:
  stirling-data:
  stirling-logs:
  whisper-models:
  tts-models:
