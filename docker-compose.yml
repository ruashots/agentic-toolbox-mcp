name: toolbox

# PRIVACY RULE: the toolbox keeps no record of what agents asked for or got back.
#  - container logs are off (driver "none"); to debug, use docker-compose.debug-logs.yml
#    for as short a time as possible (see docs/operations.md, "Debugging without logs")
#  - no core dumps (they are copies of process memory). The limit is 1 byte, not 0:
#    with 0, Linux still hands a crash to the host's crash collector when it has one
#    (WSL 2 always does, and many distributions do), and that saves the dump anyway.
#    With 1, the kernel drops the dump before any collector sees it.
#  - scratch space (/tmp and other per-request dirs) is RAM-only tmpfs, never disk
x-private: &private
  logging:
    driver: none
  ulimits:
    core: 1

services:
  searxng:
    image: searxng/searxng@sha256:1a9d21346437a41ddfc2286968026dddece1d4d0721625cffa2c3b00bb2f9cf3  # frozen 2026-11-19
    container_name: tb-searxng
    restart: unless-stopped
    <<: *private
    tmpfs:
      - /tmp:size=256m
    networks: [toolbox]
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      # Without this the image chowns ./searxng in your clone to its own user,
      # and a later `git pull` cannot update searxng/settings.yml.
      - FORCE_OWNERSHIP=false

  crawl4ai:
    # Frozen upstream image with its record-keeping off and its browser's protections
    # back on; see crawl4ai/Dockerfile and crawl4ai/patch-crawl4ai.py.
    build: ./crawl4ai
    image: toolbox-crawl4ai
    container_name: tb-crawl4ai
    restart: unless-stopped
    <<: *private
    # Nothing the browser does can be saved to disk.
    read_only: true
    tmpfs:
      - /tmp:size=1g
      - /home/appuser/.crawl4ai:uid=999,gid=999,mode=0755,size=128m
      - /home/appuser/.gunicorn:uid=999,gid=999,mode=0700,size=64k
      # Chrome will not start without a folder for crash reports. This one is too
      # small to hold a report, so a browser crash leaves none.
      - /home/appuser/.config:uid=999,gid=999,mode=0700,size=128k
    networks: [toolbox]
    shm_size: 1gb
    environment:
      - INSTALL_TYPE=all
      - ENABLE_GPU=false

  stirling-pdf:
    image: frooodle/s-pdf@sha256:b75b5ae2fcb75948f468718ed4c0bd499a8cafc9daf7f90f4c1e0e5a6acf9df8  # Stirling 2.11.0 pinned 2026-06-02 (was :latest; auto-broke auth+endpoint)
    container_name: tb-stirling
    restart: unless-stopped
    <<: *private
    tmpfs:
      - /tmp:size=1g
      - /home/stirlingpdfuser:uid=1000,gid=1000,mode=0755,size=256m   # LibreOffice keeps a recent-documents list here
      - /logs:uid=1000,gid=1000,mode=0755,size=16m
    networks: [toolbox]
    ports:
      - "8085:8080"   # exposed for direct UI use; gateway also calls it internally
    volumes:
      - stirling-data:/configs
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - SECURITY_ENABLELOGIN=false
      - LANGS=en_US
      # No audit trail of conversions, no analytics, no log output.
      - PREMIUM_ENTERPRISEFEATURES_AUDIT_ENABLED=false
      - SYSTEM_ENABLEANALYTICS=false
      - SYSTEM_ENABLEPOSTHOG=false
      - SYSTEM_ENABLESCARF=false
      - LOGGING_LEVEL_ROOT=OFF
      # The image tells Java to write a heap dump (a copy of its memory, so of the PDFs
      # it is working on) to /configs, the stirling-data volume, if it runs out of memory.
      - JAVA_CUSTOM_OPTS=-XX:-HeapDumpOnOutOfMemoryError

  whisper:
    build: ./whisper
    container_name: tb-whisper
    restart: unless-stopped
    <<: *private
    tmpfs:
      - /tmp:size=2g
    networks: [toolbox]
    # Runs on the CPU. To run it on an AMD GPU, add docker-compose.amd-gpu.yml
    # (README: "Transcription on an AMD GPU").
    volumes:
      - whisper-models:/models

  tts:
    build: ./tts
    container_name: tb-tts
    restart: unless-stopped
    <<: *private
    tmpfs:
      - /tmp:size=2g
    networks: [toolbox]
    # Runs on the CPU (the image ships CPU-only PyTorch). Synthesis is the one
    # CPU-heavy tool in the stack; OMP_NUM_THREADS in tts/Dockerfile sets how many
    # threads it uses.
    volumes:
      - tts-models:/models

  gateway:
    build: ./gateway
    container_name: tb-gateway
    restart: unless-stopped
    <<: *private
    tmpfs:
      - /tmp:size=4g   # browser profiles, downloads, converted files: RAM only, gone on restart
      # The browser draws pages through Mesa, which caches the shaders it compiles
      # for them on disk. Keep that cache in RAM too.
      - /root/.cache/mesa_shader_cache:size=64m
      - /root/.cache/mesa_shader_cache_db:size=64m
    networks: [toolbox]
    ports:
      - "8000:8000"   # MCP streamable-http endpoint
    environment:
      - SEARXNG_URL=http://searxng:8080
      - CRAWL4AI_URL=http://crawl4ai:11235
      - STIRLING_URL=http://stirling-pdf:8080
      - WHISPER_URL=http://whisper:8000
      - TTS_URL=http://tts:8000
      # No calls home: FastMCP checks PyPI for a newer version when it starts, and
      # onnxruntime (used by MarkItDown) keeps and may send Microsoft usage telemetry.
      - FASTMCP_CHECK_FOR_UPDATES=off
      - ORT_DISABLE_TELEMETRY=1
    volumes:
      - tb-health:/health:ro   # written by tb-watch; read to tell agents which tools are down
    # The Camoufox browser is baked into the image at build time (gateway/Dockerfile),
    # and there is no volume for /root/.cache. At run time Firefox still fetches its
    # media plugins, as stock Firefox does (README, privacy section).
    depends_on:
      - searxng
      - crawl4ai
      - stirling-pdf
      - whisper
      - tts

  # Runs one real job per tool on a schedule (see gateway/watch.py) and writes the
  # result for the gateway, which explains failures to agents. Same image as the
  # gateway (same pinned client library and fixtures).
  watch:
    build: ./gateway
    image: toolbox-watch
    container_name: tb-watch
    restart: unless-stopped
    # The watcher's log holds only its own fixed test jobs (wikipedia.org, the files in
    # gateway/fixtures), never agent requests, so it keeps a small log for diagnosis.
    logging:
      driver: local
      options:
        max-size: 1m
        max-file: "2"
    ulimits:
      core: 1   # see PRIVACY RULE at the top
    tmpfs:
      - /tmp:size=256m
    networks: [toolbox]
    command: ["python", "watch.py"]
    volumes:
      - tb-health:/health
    environment:
      - GATEWAY_MCP_URL=http://gateway:8000/mcp
    depends_on:
      - gateway

networks:
  toolbox:
    driver: bridge

volumes:
  stirling-data:
  whisper-models:
  tts-models:
  tb-health:
